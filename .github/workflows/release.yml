# Build main.js and attach it (+ manifest.json) to a GitHub Release,
# with a signed build-provenance attestation for main.js.
# Trigger: push a tag equal to the manifest version, e.g.  git tag 0.2.4 && git push origin 0.2.4
# Obsidian requires the release TAG to exactly match manifest.json "version" (no leading "v").
name: Release Obsidian plugin
on:
  push:
    tags:
      - '*'
permissions:
  contents: write        # create the release
  id-token: write        # sign the attestation
  attestations: write    # record the attestation
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
      - name: Attest build provenance for main.js
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'main.js'
      - name: Create release with plugin assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Annotex Publish $GITHUB_REF_NAME" \
            main.js manifest.json
